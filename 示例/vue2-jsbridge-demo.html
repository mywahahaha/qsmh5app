<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Vue2 JSBridge 示例</title>
  <style>
    body { margin: 0; padding: 24px; color: #222; font: 16px/1.6 Arial, sans-serif; }
    #app { max-width: 560px; margin: 0 auto; }
    button, input { box-sizing: border-box; width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; }
    button { border: 0; border-radius: 6px; color: #fff; background: #3478f6; }
    input { border: 1px solid #ccc; border-radius: 6px; }
    pre { overflow-wrap: anywhere; white-space: pre-wrap; }
    .hint { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app">
    <h2>Vue2 JSBridge 示例</h2>

    <button type="button" @click="getAccountToken">获取 accountToken</button>
    <p>获取结果：<strong>{{ accountToken || '尚未获取' }}</strong></p>

    <button type="button" @click="getGameInfo">获取游戏端基础信息</button>
    <pre>{{ gameInfoText }}</pre>

    <label for="page-name">要关闭的窗口实例名</label>
    <input id="page-name" v-model.trim="pageName" placeholder="例如 web_welfare">
    <button type="button" @click="closeMiniWindow">关闭窗口</button>

    <label for="package-name">第三方应用包名</label>
    <input id="package-name" v-model.trim="packageName" placeholder="例如 com.me74.qsmhz">
    <button type="button" @click="isAppInstalled">检测是否已安装</button>
    <button type="button" @click="openApp">打开第三方应用</button>

    <p class="hint">请在 SDK 的 WebView 中打开。浏览器直接打开时没有原生桥接，会显示未检测到 SDK。配置了 $http 的同源 Axios 请求会自动附带游戏 Header。</p>
    <pre>{{ message }}</pre>
  </div>

  <!-- Vue 2 CDN；生产环境建议固定版本并使用可信赖的 CDN。 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="./qsm-jsbridge.js"></script>
  <script>
    var gameApi = axios.create({
      baseURL: 'https://box.74meng.com'
    });
    GameBridge.installAxiosInterceptors(gameApi);
    Vue.prototype.$http = gameApi;

    new Vue({
      el: '#app',
      data: {
        accountToken: '',
        gameInfoText: '尚未获取游戏信息',
        pageName: 'web_welfare',
        packageName: 'com.me74.qsmhz',
        message: '等待操作'
      },
      methods: {
        isAppInstalled: function () {
          var vm = this;
          return GameBridge.isAppInstalled(this.packageName).then(function (installed) {
            vm.message = installed ? '应用已安装' : '应用未安装或系统不可见';
            return installed;
          }).catch(function (error) {
            vm.message = '检测失败：' + error.message;
            return false;
          });
        },
        openApp: function () {
          // 仅在用户点击按钮后调用，不在页面加载时自动唤起。
          var vm = this;
          return GameBridge.openApp(this.packageName).then(function (opened) {
            vm.message = opened ? '系统已接受应用启动请求' : '无法打开：应用未安装、没有启动入口或被系统限制';
            return opened;
          }).catch(function (error) {
            vm.message = '打开失败：' + error.message;
            return false;
          });
        },
        getAccountToken: function () {
          var vm = this;
          this.message = '正在获取 accountToken…';
          return GameBridge.getAccountToken().then(function (data) {
            vm.accountToken = data && data.accountToken || '';
            vm.message = vm.accountToken ? '获取成功' : '接口成功，但返回的 accountToken 为空';
            return vm.accountToken;
          }).catch(function (error) {
            vm.message = '获取 accountToken 失败：' + error.message;
            return null;
          });
        },
        getGameInfo: function () {
          var vm = this;
          this.message = '正在获取游戏端基础信息…';
          return GameBridge.getGameInfo().then(function (gameInfo) {
            vm.gameInfoText = JSON.stringify(gameInfo, null, 2);
            vm.message = '游戏信息获取成功';
            return gameInfo;
          }).catch(function (error) {
            vm.gameInfoText = '获取失败';
            vm.message = '获取游戏信息失败：' + error.message;
            return null;
          });
        },
        closeMiniWindow: function () {
          if (!this.pageName) {
            this.message = '请先填写要关闭的窗口实例名。';
            return Promise.resolve(false);
          }

          var vm = this;
          var page = this.pageName;
          this.message = '正在请求 SDK 关闭窗口：' + page;
          return GameBridge.closeMiniWindow(page).then(function (closed) {
            vm.message = closed ? 'SDK 已确认关闭窗口：' + page : '窗口未关闭：请确认实例名正确且窗口已打开。';
            return closed;
          }).catch(function (error) {
            vm.message = '关闭窗口失败：' + error.message;
            return false;
          });
        }
      }
    });
  </script>
</body>
</html>
